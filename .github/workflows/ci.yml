name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gauntlet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: bash scripts/gauntlet.sh

  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build local release dist and run installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in x86_64|amd64) arch=amd64;; arm64|aarch64) arch=arm64;; esac
          ver="v0.10.0"
          name="nrp-mcp_${ver#v}_${os}_${arch}"
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist/$name"
          go build -trimpath -ldflags "-s -w" -o "$dist/$name/nrp-mcp" ./cmd/nrp-mcp
          cp LICENSE README.md "$dist/$name/"
          tar -C "$dist" -czf "$dist/$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$dist" && sha256sum "$name.tar.gz" > SHA256SUMS)
          else
            (cd "$dist" && shasum -a 256 "$name.tar.gz" > SHA256SUMS)
          fi
          fresh="$RUNNER_TEMP/fresh-home"
          mkdir -p "$fresh"
          sh_env="/bin/bash"
          [ "$os" = darwin ] && sh_env="/bin/zsh"
          out="$(HOME="$fresh" SHELL="$sh_env" PATH="/usr/bin:/bin:/usr/sbin:/sbin" NRP_MCP_VERSION="$ver" NRP_MCP_BASE="file://$dist" NRP_MCP_YES=1 sh scripts/install.sh)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fq "Binary path: $fresh/.local/bin/nrp-mcp"
          test -x "$fresh/.local/bin/nrp-mcp"
          "$fresh/.local/bin/nrp-mcp" version
          if [ "$os" = darwin ]; then
            grep -Fq "$fresh/.local/bin" "$fresh/.zprofile"
          else
            grep -Fq "$fresh/.local/bin" "$fresh/.bashrc"
          fi
      - name: Build local release dist and run install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "v0.10.0"
          $name = "nrp-mcp_0.10.0_windows_amd64"
          $dist = Join-Path $env:RUNNER_TEMP "dist"
          $pkg = Join-Path $dist $name
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          go build -trimpath -ldflags "-s -w" -o (Join-Path $pkg "nrp-mcp.exe") ./cmd/nrp-mcp
          Copy-Item LICENSE, README.md -Destination $pkg
          $zip = Join-Path $dist "$name.zip"
          Compress-Archive -Path $pkg -DestinationPath $zip -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $dist "SHA256SUMS") -Value "$hash  $name.zip" -Encoding Ascii
          $binDir = Join-Path $env:RUNNER_TEMP "Programs\nrp-mcp"
          $env:NRP_MCP_VERSION = $ver
          $env:NRP_MCP_BASE = $dist
          $env:NRP_MCP_BIN = $binDir
          & .\scripts\install.ps1
          $exe = Join-Path $binDir "nrp-mcp.exe"
          if (-not (Test-Path $exe)) { throw "nrp-mcp.exe not installed at $exe" }
          & $exe version
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($userPath -split ";") -notcontains $binDir) {
            throw "User PATH missing $binDir : $userPath"
          }
