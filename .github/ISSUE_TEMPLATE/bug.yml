name: Bug report
description: Something did not work as described
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: nrp-mcp version
      description: Output of `nrp-mcp version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and AI client
      placeholder: macOS 15 (arm64), Claude Code 2.x
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the tool's summary text. Do not paste tokens, keys or private data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
